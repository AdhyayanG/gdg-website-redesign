[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/tracks"
  to = "/tracks.html"
  status = 200

[[redirects]]
  from = "/demo-night"
  to = "/demo-night.html"
  status = 200

[[redirects]]
  from = "/speakers"
  to = "/speakers.html"
  status = 200

[[redirects]]
  from = "/awards"
  to = "/awards.html"
  status = 200

[[redirects]]
  from = "/sponsors"
  to = "/sponsors.html"
  status = 200
